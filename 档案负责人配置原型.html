<html lang="zh-CN">

    .brand{display:flex;align-items:center;gap:10px;padding:0 26px;color:#fff;background:linear-gradient(110deg,#15b8d7,#2087e8);font-size:19px;font-weight:700;white-space:nowrap}.brand-mark{width:31px;height:31px;border:1px solid rgba(255,255,255,.65);border-radius:50%;display:grid;place-items:center}.global-nav{min-width:0;display:flex;align-items:stretch;padding-left:2px;overflow-x:auto}.global-nav button{position:relative;min-width:max-content;padding:0 20px;border:0;color:#30343b;background:transparent;font-size:15px}.global-nav button:hover{color:var(--primary)}.global-nav button.active{color:var(--primary);font-weight:600}.global-nav button.active::after{content:"";position:absolute;left:20px;right:20px;bottom:0;height:3px;background:var(--primary)}.header-user{display:flex;align-items:center;gap:18px;padding:0 22px}.notice-btn{position:relative;width:34px;height:34px;border:0;display:grid;place-items:center;background:transparent}.notice-dot{position:absolute;right:0;top:-1px;min-width:18px;height:18px;padding:0 4px;border:2px solid #fff;border-radius:10px;display:grid;place-items:center;color:#fff;background:var(--red);font-size:10px}.user{display:flex;align-items:center;gap:8px;white-space:nowrap}.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--primary);background:var(--primary-soft);font-weight:700}

    .entity-select{position:relative;min-height:42px;border:1px solid var(--line-strong);border-radius:5px;background:#fff}.entity-trigger{width:100%;min-height:40px;padding:5px 36px 5px 8px;border:0;display:flex;align-items:center;flex-wrap:wrap;gap:5px;color:var(--text);background:transparent;text-align:left}.entity-trigger>svg{position:absolute;right:10px;top:12px;color:var(--muted)}.placeholder{padding:4px 2px;color:#b4b8bf}.selected-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border:1px solid #bae0ff;border-radius:3px;color:var(--primary);background:#f0f8ff;font-size:12px}.selected-tag .remove{padding:0;border:0;display:grid;place-items:center;color:#69a8ea;background:transparent}.entity-popover{position:absolute;z-index:5;left:-1px;right:-1px;top:calc(100% + 6px);display:none;padding:8px;border:1px solid var(--line-strong);border-radius:5px;background:#fff;box-shadow:0 12px 30px rgba(31,35,41,.14)}.entity-select.open .entity-popover{display:block}.entity-search{position:relative;margin-bottom:6px}.entity-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#8a959c}.entity-search input{height:34px;padding-left:31px}.entity-options{max-height:210px;overflow:auto}.entity-option{width:100%;padding:9px;border:0;border-radius:3px;display:flex;align-items:center;gap:9px;color:var(--text);background:#fff;text-align:left;cursor:pointer}.entity-option:hover,.entity-option.active{background:#f0f7ff}.entity-option input{width:15px;height:15px;accent-color:var(--primary)}.option-code{min-width:76px;color:#515761;font-variant-numeric:tabular-nums}.option-name{font-weight:500}.no-options{padding:20px;text-align:center;color:var(--muted);font-size:12px}.modal.readonly .entity-select{background:#f7f8fa;border-color:#e1e4e8}.modal.readonly .entity-trigger{cursor:default;color:#343940}.modal.readonly .entity-trigger>svg{display:none}.modal.readonly .selected-tag{color:#4f555d;background:#f1f3f5;border-color:#dfe2e6}.modal-foot{padding:13px 22px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line)}.toast{position:fixed;z-index:70;right:22px;bottom:22px;max-width:calc(100vw - 44px);padding:11px 14px;display:flex;align-items:center;gap:8px;color:#fff;background:#2f3540;border-radius:5px;box-shadow:var(--shadow);opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:1200px){.global-header{grid-template-columns:220px minmax(0,1fr) auto}.brand{padding:0 18px}.workspace{grid-template-columns:220px minmax(0,1fr)}.page{padding-left:12px;padding-right:12px}.table th,.table td{padding-left:4px;padding-right:4px}.filters{grid-template-columns:1fr 1fr}.filter-actions{grid-column:1/-1}.global-nav button{padding:0 13px}.global-nav button.active::after{left:13px;right:13px}}
    @media(max-width:760px){.global-header{height:56px;grid-template-columns:1fr auto}.brand{font-size:17px}.global-nav{display:none}.header-user{padding:0 14px}.notice-btn{display:none}.workspace{min-height:calc(100vh - 56px);grid-template-columns:1fr}.sidebar{display:none}.page-tabs{height:48px;padding:0 6px}.page-tab{height:40px;padding:0 10px}.breadcrumb{height:46px;padding:0 12px}.page{padding:12px}.filters{grid-template-columns:1fr;padding:18px 14px;gap:14px}.field{align-items:stretch;flex-direction:column;gap:6px}.field label{min-width:0;text-align:left}.filter-actions{grid-column:auto}.filter-actions .btn{flex:1}.toolbar-actions{width:100%}.toolbar-actions .btn{flex:1}.table-wrap{overflow-x:auto}.table{min-width:1040px}.form-grid{grid-template-columns:1fr}.form-field.full{grid-column:auto}.pagination{align-items:flex-start;flex-direction:column}.user strong,.user>svg{display:none}}
  </style>

<body>
<div class="app">
  <header class="global-header">
    <div class="brand"><span class="brand-mark"><i data-lucide="archive" class="icon"></i></span><span>档案管理中台</span></div>
    <nav class="global-nav" aria-label="顶部导航"><button>工作台</button><button class="active">投标档案库</button><button>风险管理部</button><button>公司履约案例</button></nav>
    <div class="header-user"><button class="notice-btn" title="待办消息"><i data-lucide="inbox" style="width:22px;height:22px"></i><span class="notice-dot">3</span></button><div class="user"><div class="avatar">管</div><strong>系统管理员</strong><i data-lucide="chevron-down" class="icon"></i></div></div>
  </header>
  <div class="workspace">
    <aside class="sidebar">
      <div class="side-search"><div class="input-wrap"><i data-lucide="search" class="icon"></i><input placeholder="搜索" aria-label="搜索菜单"></div></div>
      <nav class="side-nav" aria-label="侧边导航">
        <button class="side-item"><i data-lucide="download" class="icon"></i>检索下载</button>
        <button class="side-item"><i data-lucide="list-filter" class="icon"></i>检索下载（新）</button>
        <div class="side-section">组织与权限</div>
        <button class="side-item parent"><i data-lucide="folder-open" class="icon"></i>系统设置<i data-lucide="chevron-up" class="icon" style="margin-left:auto"></i></button>
        <button class="side-item child">公司管理</button>
        <button class="side-item child">公司人员配置</button>
        <button class="side-item child active">档案负责人配置</button>
        <button class="side-item child">角色权限</button>
        <button class="side-item child">操作日志</button>
        <div class="side-section">档案分类</div>
        <button class="side-item child">基本证件</button>
        <button class="side-item child">人员证书</button>
        <button class="side-item child">荣誉证书</button>
      </nav>
      <div class="side-footer"><i data-lucide="panel-left-close" class="icon"></i></div>
    </aside>
    <div class="main">
      <div class="page-tabs"><button class="page-tab"><span class="tab-dot"></span>工作台<span class="tab-close"><i data-lucide="x" style="width:14px;height:14px"></i></span></button><button class="page-tab active"><span class="tab-dot"></span>档案负责人配置<span class="tab-close"><i data-lucide="x" style="width:14px;height:14px"></i></span></button></div>
      <div class="breadcrumb"><span>系统设置</span><span>/</span><span>档案配置</span><span>/</span><strong>档案负责人配置</strong></div>
      <main class="page">
        <section class="filter-panel">
          <header class="page-title"><div><h1>档案负责人配置</h1><p>按档案模块配置一位或多位档案负责人</p></div></header>
          <div class="filters">
            <div class="field"><label for="companyFilter">公司：</label><select id="companyFilter"><option value="">全部公司</option></select></div>
            <div class="field"><label for="moduleFilter">档案模块：</label><select id="moduleFilter"><option value="">全部模块</option></select></div>
            <div class="field"><label for="keyword">档案负责人：</label><div class="input-wrap"><i data-lucide="search" class="icon"></i><input id="keyword" placeholder="请输入工号或姓名" autocomplete="off"></div></div>
            <div class="filter-actions"><button class="btn" id="resetBtn">重置</button><button class="btn btn-primary" id="searchBtn"><i data-lucide="search" class="icon"></i>查询</button></div>
          </div>
        </section>
        <section class="panel">
          <div class="table-toolbar"><div class="toolbar-actions"><button class="btn btn-danger" id="deleteBtn" disabled><i data-lucide="trash-2" class="icon"></i>删除</button><button class="btn btn-primary" id="addBtn"><i data-lucide="plus" class="icon"></i>新增</button></div></div>
          <div class="table-wrap" id="tableWrap"></div>
          <footer class="pagination"><span id="pageSummary"></span><div class="page-buttons"><button class="page-button" disabled title="上一页"><i data-lucide="chevron-left" class="icon"></i></button><button class="page-button active">1</button><button class="page-button" disabled title="下一页"><i data-lucide="chevron-right" class="icon"></i></button></div></footer>
        </section>
      </main>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<section class="modal" id="formModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
  <header class="modal-head"><div><h2 id="modalTitle">新增配置</h2><p id="modalSubtitle">选择档案模块及负责人</p></div><button class="icon-btn" id="closeBtn" title="关闭"><i data-lucide="x"></i></button></header>
  <div class="modal-body">
    <div class="form-grid">
      <div class="form-field full" id="companyField"><label><span class="required">*</span> 公司</label>
        <div class="entity-select" id="companySelect">
          <button class="entity-trigger" id="companyTrigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="placeholder">请选择公司</span><i data-lucide="chevron-down" class="icon"></i></button>
          <div class="entity-popover"><div class="entity-search"><i data-lucide="search" class="icon"></i><input id="companySearch" placeholder="搜索公司编码或名称" autocomplete="off"></div><div class="entity-options" id="companyOptions"></div></div>
        </div>
        <div class="field-error"></div>
      </div>
      <div class="form-field full" id="moduleField"><label><span class="required">*</span> 档案模块</label>
        <div class="entity-select" id="moduleSelect">
          <button class="entity-trigger" id="moduleTrigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="placeholder">请选择档案模块</span><i data-lucide="chevron-down" class="icon"></i></button>
          <div class="entity-popover"><div class="entity-search"><i data-lucide="search" class="icon"></i><input id="moduleSearch" placeholder="搜索模块名称" autocomplete="off"></div><div class="entity-options" id="moduleOptions"></div></div>
        </div>
        <div class="field-error"></div>
      </div>
      <div class="form-field full" id="ownerField"><label><span class="required">*</span> 档案负责人</label>
        <div class="entity-select" id="ownerSelect">
          <button class="entity-trigger" id="ownerTrigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="placeholder">请选择档案负责人（可多选）</span><i data-lucide="chevron-down" class="icon"></i></button>
          <div class="entity-popover"><div class="entity-search"><i data-lucide="search" class="icon"></i><input id="ownerSearch" placeholder="搜索工号或姓名" autocomplete="off"></div><div class="entity-options" id="ownerOptions"></div></div>
        </div>
        <div class="field-error"></div>
      </div>
    </div>
  </div>
  <footer class="modal-foot"><button class="btn" id="cancelBtn">取消</button><button class="btn btn-primary" id="saveBtn"><i data-lucide="check" class="icon"></i>保存</button></footer>
</section>
<section class="modal confirm-modal" id="deleteModal" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle" aria-hidden="true">
  <header class="modal-head"><div><h2 id="deleteModalTitle">删除配置</h2><p>删除档案模块与负责人的配置关系</p></div><button class="icon-btn" id="closeDeleteBtn" title="关闭"><i data-lucide="x"></i></button></header>
  <div class="modal-body"><div class="confirm-content"><span class="confirm-icon"><i data-lucide="triangle-alert" class="icon"></i></span><p id="deleteMessage"></p></div></div>
  <footer class="modal-foot"><button class="btn" id="cancelDeleteBtn">取消</button><button class="btn btn-danger" id="confirmDeleteBtn">确认删除</button></footer>
</section>
<div class="toast" id="toast"><i data-lucide="circle-check" class="icon"></i><span></span></div>

<script>
const archiveModules=[
  {code:'DA001',name:'人员证书'},
  {code:'DA002',name:'分子公司基本证件'},
  {code:'DA003',name:'纳税完税证明'},
  {code:'DA004',name:'人员花名册'},
  {code:'DA005',name:'社保完税证明'},
  {code:'DA006',name:'荣誉证书'},
  {code:'DA007',name:'食品检测报告'}
];
const companies=[
  {code:'C0001',name:'永辉集团总部'},
  {code:'C0101',name:'北京永辉超市有限公司'},
  {code:'C0201',name:'上海永辉超市有限公司'},
  {code:'C0301',name:'福建永辉彩食鲜发展有限公司'},
  {code:'C0401',name:'四川永辉物流有限公司'},
  {code:'C0501',name:'重庆永辉超市有限公司'}
];
const personDirectory=[
  {employeeId:'YH10086',name:'张晓林'},
  {employeeId:'YH10217',name:'李思雨'},
  {employeeId:'YH10305',name:'王一凡'},
  {employeeId:'YH10628',name:'陈嘉禾'},
  {employeeId:'YH10811',name:'周敏'},
  {employeeId:'YH10999',name:'赵新宇'},
  {employeeId:'YH11028',name:'林静怡'}
];
let configurations=[
  {id:1,companyCode:'C0001',moduleCode:'DA001',ownerIds:['YH10086','YH10217'],createdBy:'洪亮',createdAt:'2026-09-01 09:16',modifiedBy:'王珊',modifiedAt:'2026-09-16 14:32'},
  {id:2,companyCode:'C0101',moduleCode:'DA002',ownerIds:['YH10305'],createdBy:'洪亮',createdAt:'2026-09-02 10:05',modifiedBy:'李文',modifiedAt:'2026-09-15 09:18'},
  {id:3,companyCode:'C0201',moduleCode:'DA003',ownerIds:['YH10628','YH10811'],createdBy:'张敏',createdAt:'2026-09-03 11:24',modifiedBy:'洪亮',modifiedAt:'2026-09-12 16:45'},
  {id:4,companyCode:'C0001',moduleCode:'DA004',ownerIds:['YH10217'],createdBy:'洪亮',createdAt:'2026-09-05 14:08',modifiedBy:'洪亮',modifiedAt:'2026-09-10 11:06'},
  {id:5,companyCode:'C0301',moduleCode:'DA006',ownerIds:['YH10999','YH11028'],createdBy:'王珊',createdAt:'2026-09-08 17:20',modifiedBy:'',modifiedAt:''}
];
let filters={keyword:'',companyCode:'',moduleCode:''};
let form={mode:'add',editingId:null,companyCode:'',moduleCode:'',ownerIds:[]};
let selectedIds=new Set();
const $=selector=>document.querySelector(selector);
const $$=selector=>[...document.querySelectorAll(selector)];
const escapeHtml=value=>String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));

function refreshIcons(){if(window.lucide)lucide.createIcons()}
function moduleByCode(code){return archiveModules.find(module=>module.code===code)}
function companyByCode(code){return companies.find(company=>company.code===code)}
function personById(employeeId){return personDirectory.find(person=>person.employeeId===employeeId)}
function moduleLabel(code){const module=moduleByCode(code);return module?`${module.code} ${module.name}`:code}
function companyLabel(code){const company=companyByCode(code);return company?`${company.code} ${company.name}`:code}
function personLabel(employeeId){const person=personById(employeeId);return person?`${person.employeeId} ${person.name}`:employeeId}
function timeHtml(value){if(!value)return '—';const [date,time]=value.split(' ');return time?`<span>${escapeHtml(date)}</span><span>${escapeHtml(time)}</span>`:escapeHtml(value)}
function filteredConfigurations(){const keyword=filters.keyword.toLowerCase();return configurations.filter(item=>(!filters.companyCode||item.companyCode===filters.companyCode)&&(!filters.moduleCode||item.moduleCode===filters.moduleCode)&&(!keyword||item.ownerIds.some(id=>personLabel(id).toLowerCase().includes(keyword))))}
function updateDeleteButton(){$('#deleteBtn').disabled=selectedIds.size===0}
function renderTable(){
  const data=filteredConfigurations();
  $('#pageSummary').textContent=data.length?`第 1–${data.length} 条，共 ${data.length} 条`:'共 0 条';
  const allSelected=data.length>0&&data.every(item=>selectedIds.has(item.id));
  const someSelected=data.some(item=>selectedIds.has(item.id));
  $('#tableWrap').innerHTML=data.length?`<table class="table"><thead><tr><th style="width:3%"><input class="row-check" id="selectAll" type="checkbox" aria-label="全选当前列表" ${allSelected?'checked':''}></th><th style="width:5%">序号</th><th style="width:14%">公司</th><th style="width:12%">档案模块</th><th style="width:17%">档案负责人</th><th style="width:7%">创建人</th><th style="width:10%">创建时间</th><th style="width:7%">修改人</th><th style="width:10%">修改时间</th><th style="width:15%">操作</th></tr></thead><tbody>${data.map((item,index)=>{const company=companyByCode(item.companyCode);const module=moduleByCode(item.moduleCode);const checked=selectedIds.has(item.id);const owners=item.ownerIds.map(id=>{const owner=personById(id);return `<span class="owner-tag"><small>${escapeHtml(owner?.employeeId||id)}</small>${escapeHtml(owner?.name||'')}</span>`}).join('');return `<tr class="${checked?'selected':''}"><td><input class="row-check row-selector" type="checkbox" data-id="${item.id}" aria-label="选择 ${escapeHtml(module?.name||item.moduleCode)}" ${checked?'checked':''}></td><td class="muted">${String(index+1).padStart(2,'0')}</td><td class="main-cell" title="${escapeHtml(companyLabel(item.companyCode))}"><div class="module-name">${escapeHtml(company?.name||item.companyCode)}</div><div class="muted">${escapeHtml(company?.code||item.companyCode)}</div></td><td class="main-cell" title="${escapeHtml(moduleLabel(item.moduleCode))}"><div class="module-name">${escapeHtml(module?.name||item.moduleCode)}</div><div class="muted">${escapeHtml(module?.code||item.moduleCode)}</div></td><td><div class="owner-list">${owners}</div></td><td>${escapeHtml(item.createdBy)}</td><td class="muted time-cell">${timeHtml(item.createdAt)}</td><td>${escapeHtml(item.modifiedBy||'—')}</td><td class="muted time-cell">${timeHtml(item.modifiedAt)}</td><td class="action-cell"><div class="row-actions"><button class="btn-link view-btn" data-id="${item.id}"><i data-lucide="eye" class="icon"></i>查看</button><span class="action-divider"></span><button class="btn-link edit-btn" data-id="${item.id}"><i data-lucide="pencil" class="icon"></i>编辑</button></div></td></tr>`}).join('')}</tbody></table>`:`<div class="empty"><div class="empty-icon"><i data-lucide="search-x"></i></div><h3>没有匹配的配置</h3><p>请调整公司、档案模块或档案负责人查询条件</p><button class="btn" id="clearFilters">清除筛选</button></div>`;
  if($('#selectAll')){$('#selectAll').indeterminate=someSelected&&!allSelected;$('#selectAll').onchange=event=>{data.forEach(item=>event.target.checked?selectedIds.add(item.id):selectedIds.delete(item.id));renderTable()}}
  $$('.row-selector').forEach(checkbox=>checkbox.onchange=()=>{const id=Number(checkbox.dataset.id);checkbox.checked?selectedIds.add(id):selectedIds.delete(id);renderTable()});
  $$('.view-btn').forEach(button=>button.onclick=()=>openView(Number(button.dataset.id)));
  $$('.edit-btn').forEach(button=>button.onclick=()=>openEdit(Number(button.dataset.id)));
  if($('#clearFilters'))$('#clearFilters').onclick=resetFilters;
  updateDeleteButton();
  refreshIcons();
}
function render(){renderTable()}
function runSearch(){filters.keyword=$('#keyword').value.trim();filters.companyCode=$('#companyFilter').value;filters.moduleCode=$('#moduleFilter').value;selectedIds.clear();renderTable()}
function resetFilters(){filters={keyword:'',companyCode:'',moduleCode:''};selectedIds.clear();$('#keyword').value='';$('#companyFilter').value='';$('#moduleFilter').value='';renderTable()}

function openAdd(){form={mode:'add',editingId:null,companyCode:'',moduleCode:'',ownerIds:[]};$('#modalTitle').textContent='新增配置';$('#modalSubtitle').textContent='选择公司、档案模块及一位或多位档案负责人';clearErrors();renderCompanyOptions();renderModuleOptions();renderOwnerOptions();openModal();setTimeout(()=>$('#companyTrigger').focus(),100)}
function openEdit(id){const item=configurations.find(config=>config.id===id);if(!item)return;form={mode:'edit',editingId:id,companyCode:item.companyCode,moduleCode:item.moduleCode,ownerIds:[...item.ownerIds]};$('#modalTitle').textContent='编辑配置';$('#modalSubtitle').textContent=`正在编辑 ${companyLabel(item.companyCode)} · ${moduleByCode(item.moduleCode)?.name||item.moduleCode} 的负责人配置`;clearErrors();renderCompanyOptions();renderModuleOptions();renderOwnerOptions();openModal();setTimeout(()=>$('#companyTrigger').focus(),100)}
function openView(id){const item=configurations.find(config=>config.id===id);if(!item)return;form={mode:'view',editingId:id,companyCode:item.companyCode,moduleCode:item.moduleCode,ownerIds:[...item.ownerIds]};$('#modalTitle').textContent='查看配置';$('#modalSubtitle').textContent=`查看 ${companyLabel(item.companyCode)} · ${moduleByCode(item.moduleCode)?.name||item.moduleCode} 的负责人配置`;clearErrors();renderCompanyOptions();renderModuleOptions();renderOwnerOptions();openModal()}
function setModalMode(){const readonly=form.mode==='view';$('#formModal').classList.toggle('readonly',readonly);$('#companyTrigger').disabled=readonly;$('#moduleTrigger').disabled=readonly;$('#ownerTrigger').disabled=readonly;$('#cancelBtn').textContent=readonly?'关闭':'取消';$('#saveBtn').style.display=readonly?'none':''}
function openModal(){setModalMode();$('#overlay').classList.add('open');$('#formModal').classList.add('open');$('#formModal').setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function closeSelects(){$$('.entity-select').forEach(select=>select.classList.remove('open'));$$('.entity-trigger').forEach(trigger=>trigger.setAttribute('aria-expanded','false'))}
function closeModal(){closeSelects();$('#overlay').classList.remove('open');$('#formModal').classList.remove('open');$('#formModal').setAttribute('aria-hidden','true');document.body.style.overflow=''}
function openDeleteModal(){if(!selectedIds.size)return;$('#deleteMessage').textContent=`确定删除已选中的 ${selectedIds.size} 条配置吗？删除后不可恢复。`;$('#overlay').classList.add('open');$('#deleteModal').classList.add('open');$('#deleteModal').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';setTimeout(()=>$('#confirmDeleteBtn').focus(),100)}
function closeDeleteModal(){$('#overlay').classList.remove('open');$('#deleteModal').classList.remove('open');$('#deleteModal').setAttribute('aria-hidden','true');document.body.style.overflow=''}
function closeActiveModal(){if($('#deleteModal').classList.contains('open'))closeDeleteModal();else if($('#formModal').classList.contains('open'))closeModal()}
function deleteSelected(){configurations=configurations.filter(item=>!selectedIds.has(item.id));selectedIds.clear();closeDeleteModal();render();showToast('删除成功')}

function renderOwnerOptions(search=''){
  const keyword=search.trim().toLowerCase();
  const matched=personDirectory.filter(person=>`${person.employeeId} ${person.name}`.toLowerCase().includes(keyword));
  $('#ownerOptions').innerHTML=matched.length?matched.map(person=>`<button class="entity-option ${form.ownerIds.includes(person.employeeId)?'active':''}" type="button" data-owner-id="${person.employeeId}"><input type="checkbox" tabindex="-1" ${form.ownerIds.includes(person.employeeId)?'checked':''}><span class="option-code">${person.employeeId}</span><span class="option-name">${escapeHtml(person.name)}</span></button>`).join(''):'<div class="no-options">没有匹配的人员</div>';
  $$('#ownerOptions .entity-option').forEach(button=>button.onclick=()=>{const id=button.dataset.ownerId;form.ownerIds=form.ownerIds.includes(id)?form.ownerIds.filter(ownerId=>ownerId!==id):[...form.ownerIds,id];clearFieldError('ownerField');renderOwnerOptions($('#ownerSearch').value)});
  renderOwnerTrigger();
}
function renderOwnerTrigger(){
  const readonly=form.mode==='view';
  $('#ownerTrigger').innerHTML=form.ownerIds.length?`${form.ownerIds.map(id=>`<span class="selected-tag">${escapeHtml(personLabel(id))}${readonly?'':`<span class="remove" data-remove-owner="${id}">×</span>`}</span>`).join('')}<i data-lucide="chevron-down" class="icon"></i>`:`<span class="placeholder">请选择档案负责人（可多选）</span><i data-lucide="chevron-down" class="icon"></i>`;
  if(!readonly)$$('[data-remove-owner]').forEach(button=>button.onclick=event=>{event.stopPropagation();form.ownerIds=form.ownerIds.filter(id=>id!==button.dataset.removeOwner);renderOwnerOptions($('#ownerSearch').value)});
  refreshIcons();
}

function renderModuleOptions(search=''){
  const keyword=search.trim().toLowerCase();
  const matched=archiveModules.filter(module=>`${module.code} ${module.name}`.toLowerCase().includes(keyword));
  $('#moduleOptions').innerHTML=matched.length?matched.map(module=>`<button class="entity-option ${form.moduleCode===module.code?'active':''}" type="button" data-module-code="${module.code}"><span class="option-code">${module.code}</span><span class="option-name">${escapeHtml(module.name)}</span></button>`).join(''):'<div class="no-options">没有匹配的档案模块</div>';
  $$('#moduleOptions .entity-option').forEach(button=>button.onclick=()=>{form.moduleCode=button.dataset.moduleCode;clearFieldError('moduleField');renderModuleTrigger();closeSelects()});
  renderModuleTrigger();
}
function renderCompanyOptions(search=''){
  const keyword=search.trim().toLowerCase();
  const matched=companies.filter(company=>`${company.code} ${company.name}`.toLowerCase().includes(keyword));
  $('#companyOptions').innerHTML=matched.length?matched.map(company=>`<button class="entity-option ${form.companyCode===company.code?'active':''}" type="button" data-company-code="${company.code}"><span class="option-code">${company.code}</span><span class="option-name">${escapeHtml(company.name)}</span></button>`).join(''):'<div class="no-options">没有匹配的公司</div>';
  $$('#companyOptions .entity-option').forEach(button=>button.onclick=()=>{form.companyCode=button.dataset.companyCode;clearFieldError('companyField');renderCompanyTrigger();closeSelects()});
  renderCompanyTrigger();
}
function renderCompanyTrigger(){
  $('#companyTrigger').innerHTML=form.companyCode?`<span>${escapeHtml(companyLabel(form.companyCode))}</span><i data-lucide="chevron-down" class="icon"></i>`:`<span class="placeholder">请选择公司</span><i data-lucide="chevron-down" class="icon"></i>`;
  refreshIcons();
}
function renderModuleTrigger(){
  $('#moduleTrigger').innerHTML=form.moduleCode?`<span>${escapeHtml(moduleLabel(form.moduleCode))}</span><i data-lucide="chevron-down" class="icon"></i>`:`<span class="placeholder">请选择档案模块</span><i data-lucide="chevron-down" class="icon"></i>`;
  refreshIcons();
}
function toggleEntitySelect(type){if(form.mode==='view')return;const select=$(`#${type}Select`);const opening=!select.classList.contains('open');closeSelects();select.classList.toggle('open',opening);$(`#${type}Trigger`).setAttribute('aria-expanded',String(opening));if(opening){const search=$(`#${type}Search`);search.value='';if(type==='owner')renderOwnerOptions();else if(type==='module')renderModuleOptions();else renderCompanyOptions();setTimeout(()=>search.focus(),0)}}

function clearErrors(){$$('.form-field').forEach(field=>{field.classList.remove('invalid');field.querySelector('.field-error').textContent=''})}
function clearFieldError(id){const field=$(`#${id}`);field.classList.remove('invalid');field.querySelector('.field-error').textContent=''}
function setError(id,message){const field=$(`#${id}`);field.classList.add('invalid');field.querySelector('.field-error').textContent=message}
function validate(){
  clearErrors();
  let valid=true;
  if(!form.companyCode){setError('companyField','请选择公司');valid=false}
  if(!form.moduleCode){setError('moduleField','请选择档案模块');valid=false}else if(configurations.some(item=>item.companyCode===form.companyCode&&item.moduleCode===form.moduleCode&&item.id!==form.editingId)){setError('moduleField','该公司下的档案模块已配置，请直接编辑原配置');valid=false}
  if(!form.ownerIds.length){setError('ownerField','请至少选择一位档案负责人');valid=false}
  if(!valid){const first=$('.form-field.invalid input, .form-field.invalid .entity-trigger');if(first)first.focus()}
  return valid;
}
function save(){
  if(!validate())return;
  const timestamp='2026-09-17 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
  const data={companyCode:form.companyCode,moduleCode:form.moduleCode,ownerIds:[...form.ownerIds]};
  if(form.mode==='add'){configurations.unshift({id:Math.max(...configurations.map(item=>item.id),0)+1,...data,createdBy:'系统管理员',createdAt:timestamp,modifiedBy:'',modifiedAt:''})}else{const index=configurations.findIndex(item=>item.id===form.editingId);configurations[index]={...configurations[index],...data,modifiedBy:'系统管理员',modifiedAt:timestamp}}
  closeModal();render();showToast(form.mode==='add'?'新增成功':'保存成功');
}
function showToast(message){$('#toast span').textContent=message;$('#toast').classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>$('#toast').classList.remove('show'),2200)}

$('#companyFilter').innerHTML+=companies.map(company=>`<option value="${company.code}">${company.code} ${escapeHtml(company.name)}</option>`).join('');
$('#moduleFilter').innerHTML+=archiveModules.map(module=>`<option value="${module.code}">${escapeHtml(module.name)}</option>`).join('');
$('#addBtn').onclick=openAdd;$('#deleteBtn').onclick=openDeleteModal;$('#searchBtn').onclick=runSearch;$('#resetBtn').onclick=resetFilters;$('#keyword').onkeydown=event=>{if(event.key==='Enter')runSearch()};$('#companyFilter').onchange=runSearch;$('#moduleFilter').onchange=runSearch;
$('#closeBtn').onclick=$('#cancelBtn').onclick=closeModal;$('#closeDeleteBtn').onclick=$('#cancelDeleteBtn').onclick=closeDeleteModal;$('#confirmDeleteBtn').onclick=deleteSelected;$('#overlay').onclick=closeActiveModal;$('#saveBtn').onclick=save;$('#ownerTrigger').onclick=()=>toggleEntitySelect('owner');$('#moduleTrigger').onclick=()=>toggleEntitySelect('module');$('#companyTrigger').onclick=()=>toggleEntitySelect('company');$('#ownerSearch').oninput=event=>renderOwnerOptions(event.target.value);$('#moduleSearch').oninput=event=>renderModuleOptions(event.target.value);$('#companySearch').oninput=event=>renderCompanyOptions(event.target.value);
document.addEventListener('click',event=>{if(!event.target.closest('.entity-select'))closeSelects()});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeActiveModal()});
render();refreshIcons();
</script>
