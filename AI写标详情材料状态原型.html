<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI写标详情 - 材料补充状态</title>
  <style>
    :root {
      --blue: #1677ff;
      --blue-soft: #eaf4ff;
      --text: #20242b;
      --muted: #707780;
      --line: #e4e8eb;
      --page: #f3f5f7;
      --cyan: #16a3aa;
      --cyan-soft: #e9fbfb;
      --danger: #ff4d2e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 1080px; min-height: 100%; }
    body {
      background: var(--page);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button { font: inherit; cursor: pointer; }
    .tabs {
      height: 64px;
      display: flex;
      align-items: end;
      gap: 2px;
      padding-left: 32px;
      background: #f5f5f5;
      border-top: 3px solid #1798e8;
    }
    .tab {
      height: 61px;
      min-width: 170px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 26px;
      background: #eee;
      border-radius: 10px 10px 0 0;
      font-size: 18px;
      font-weight: 600;
    }
    .tab.active { color: var(--blue); background: #fff; }
    .tab-close { color: #868c92; font-size: 26px; font-weight: 300; line-height: 1; }
    .summary {
      height: 116px;
      display: flex;
      align-items: flex-start;
      gap: 28px;
      padding: 26px 38px;
      background: #fff;
    }
    .back {
      height: 48px;
      padding: 0 26px;
      border: 0;
      border-radius: 7px;
      color: #fff;
      background: var(--blue);
      box-shadow: 0 2px 5px rgba(22,119,255,.22);
      font-size: 17px;
    }
    .back span { margin-right: 10px; font-size: 24px; vertical-align: -1px; }
    .title-wrap { display: flex; align-items: center; gap: 14px; min-width: 0; padding-top: 8px; }
    h1 { margin: 0; font-size: 22px; letter-spacing: 0; white-space: nowrap; }
    .project-status {
      padding: 5px 12px;
      border-radius: 5px;
      color: #4ab82c;
      background: #effbe9;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
    }
    .expand {
      margin-left: auto;
      min-width: 90px;
      height: 46px;
      border: 1px solid #d4d8dc;
      border-radius: 7px;
      color: #333;
      background: #fff;
      font-size: 17px;
    }
    .action-strip { height: 76px; display: flex; align-items: center; justify-content: flex-end; padding: 0 24px; }
    .merge {
      height: 46px;
      padding: 0 24px;
      border: 0;
      border-radius: 7px;
      color: #fff;
      background: var(--blue);
      font-size: 17px;
    }
    .workspace {
      height: calc(100vh - 256px);
      min-height: 620px;
      margin: 0 32px 24px;
      padding: 36px 18px 18px;
      display: grid;
      grid-template-columns: minmax(500px, 34%) 1fr;
      gap: 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }
    .outline {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
    }
    .outline-head { height: 92px; display: flex; align-items: center; padding: 0 36px; }
    .filter { display: inline-flex; overflow: hidden; border: 1px solid #d1d7dc; border-radius: 7px; }
    .filter span { padding: 12px 20px; font-size: 16px; white-space: nowrap; }
    .filter .active { color: var(--blue); border: 1px solid var(--blue); margin: -1px 0 -1px -1px; }
    .group { padding: 14px 28px 24px; }
    .group-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; font-size: 17px; font-weight: 600; }
    .group-title-main { display: flex; align-items: center; gap: 12px; }
    .group-summary { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; font-weight: 400; white-space: nowrap; }
    .group-summary > span { display: inline-flex; align-items: center; gap: 3px; }
    .group-summary img { width: 17px; height: 17px; display: block; }
    .group-summary b { font-size: 14px; }
    .group-summary .launched b { color: #d92d20; }
    .group-summary .processed b { color: #52c41a; }
    .chevron { font-size: 13px; }
    .material-list { display: grid; gap: 10px; }
    .material-row {
      min-height: 56px;
      display: grid;
      grid-template-columns: 48px minmax(100px, 1fr) 66px 100px 72px;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      border-radius: 8px;
    }
    .material-row.selected { background: var(--blue-soft); }
    .number { color: #343a40; font-size: 16px; text-align: right; }
    .material-name { display: flex; align-items: center; gap: 9px; min-width: 0; font-size: 16px; white-space: nowrap; }
    .missing-dot { width: 12px; height: 12px; flex: 0 0 auto; border-radius: 50%; background: var(--danger); }
    .type {
      justify-self: start;
      padding: 3px 8px;
      border-radius: 5px;
      color: var(--cyan);
      background: var(--cyan-soft);
      font-size: 13px;
      white-space: nowrap;
    }
    .task-counts { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .task-count {
      min-width: 44px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0 6px;
      border: 1px solid;
      border-radius: 5px;
      font-size: 12px;
      white-space: nowrap;
    }
    .task-count img { width: 17px; height: 17px; display: block; }
    .task-count strong { font-size: 14px; }
    .task-count.launched { color: #d92d20; border-color: #ffd1cc; background: #fff4f2; }
    .task-count.processed { color: #3f9f16; border-color: #ccebbd; background: #f3fbeF; }
    .task-empty { color: #a7adb3; font-size: 18px; text-align: center; }
    .search {
      height: 32px;
      padding: 0 10px;
      border: 1px solid #a7c7ff;
      border-radius: 5px;
      color: var(--blue);
      background: #f6f9ff;
      font-size: 13px;
      white-space: nowrap;
    }
    .search.done { color: #41474e; border-color: #d3d8dd; background: #fff; }
    .editor { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 9px; background: #fafafa; }
    .editor-actions { height: 80px; display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 0 28px; border-bottom: 1px solid var(--line); background: #fff; }
    .editor-actions button { height: 44px; padding: 0 22px; border: 1px solid #d3d8dd; border-radius: 7px; background: #fff; font-size: 16px; }
    .editor-actions .primary { color: #fff; border-color: var(--blue); background: var(--blue); }
    .document-shell { height: calc(100% - 80px); display: grid; grid-template-columns: 290px 1fr; }
    .doc-outline { padding: 28px 24px; border-right: 1px solid var(--line); background: #f7f7f7; }
    .doc-outline h2 { margin: 0 0 26px; font-size: 20px; letter-spacing: 0; }
    .doc-outline button { padding: 8px 12px; border: 1px solid #d4d8dc; border-radius: 6px; background: #fff; }
    .outline-item { margin-top: 22px; color: #1f6bd2; font-size: 16px; font-weight: 600; }
    .outline-sub { margin: 16px 0 0 28px; overflow: hidden; color: #333; text-overflow: ellipsis; white-space: nowrap; }
    .paper-area { overflow: hidden; padding: 58px 46px; background: #efefef; }
    .paper { width: min(720px, 95%); min-height: 660px; margin: 0 auto; padding: 100px 90px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
    .paper h3 { margin: 0 0 28px; font-family: SimSun, serif; font-size: 22px; font-weight: 400; letter-spacing: 0; }
    .paper p { margin: 16px 0; font-family: SimSun, serif; font-size: 17px; }
    .paper-title { padding-top: 120px; text-align: center; font-size: 36px !important; font-weight: 700; }
    @media (max-width: 1320px) {
      .workspace { grid-template-columns: 500px 1fr; }
      .material-row { grid-template-columns: 42px minmax(90px, 1fr) 60px 100px 68px; gap: 6px; padding-left: 8px; padding-right: 8px; }
      .document-shell { grid-template-columns: 170px 1fr; }
      .doc-outline { padding-left: 16px; padding-right: 16px; }
      .paper-area { padding-left: 22px; padding-right: 22px; }
      .paper { padding-left: 35px; padding-right: 35px; }
      .paper-title { font-size: 28px !important; }
    }
  </style>
</head>
<body>
  <header class="tabs">
    <div class="tab">智能写标 <span class="tab-close">×</span></div>
    <div class="tab active">智能写标详情 <span class="tab-close">×</span></div>
  </header>

  <section class="summary">
    <button class="back"><span>‹</span>返回</button>
    <div class="title-wrap">
      <h1>【TB260916000001】人员-测试</h1>
      <span class="project-status">标书输出完成待审核</span>
    </div>
    <button class="expand">展开</button>
  </section>

  <div class="action-strip"><button class="merge">合并标书文件</button></div>

  <main class="workspace">
    <aside class="outline">
      <div class="outline-head">
        <div class="filter"><span class="active">展示全部</span><span>仅展示方案和材料</span></div>
      </div>
      <section class="group">
        <div class="group-title">
          <span class="group-title-main"><span class="chevron">▼</span><span>一 人员情况</span></span>
          <span class="group-summary" aria-label="补充任务汇总：已发起5个，已处理3个">
            <span class="launched" title="已发起 5 个补充任务"><img src="material-supplement-pending.svg" alt=""><b>5</b></span>
            <span class="processed" title="已处理 3 个补充任务"><img src="material-supplement-complete.svg" alt=""><b>3</b></span>
          </span>
        </div>
        <div class="material-list">
          <div class="material-row selected">
            <span class="number">1.1</span>
            <span class="material-name"><span class="missing-dot"></span>花名册1</span>
            <span class="type">材料类</span>
            <span class="task-counts" aria-label="补充任务：已发起3个，已处理1个">
              <span class="task-count launched" title="已发起 3 个补充任务"><img src="material-supplement-pending.svg" alt=""><strong>3</strong></span>
              <span class="task-count processed" title="已处理 1 个补充任务"><img src="material-supplement-complete.svg" alt=""><strong>1</strong></span>
            </span>
            <button class="search done">已检索</button>
          </div>
          <div class="material-row">
            <span class="number">1.2</span>
            <span class="material-name"><span class="missing-dot"></span>花名册2</span>
            <span class="type">材料类</span>
            <span class="task-counts" aria-label="补充任务：已发起2个，已处理2个，全部完成">
              <span class="task-count launched" title="已发起 2 个补充任务"><img src="material-supplement-pending.svg" alt=""><strong>2</strong></span>
              <span class="task-count processed" title="已处理 2 个补充任务，全部完成"><img src="material-supplement-complete.svg" alt=""><strong>2</strong></span>
            </span>
            <button class="search">去检索</button>
          </div>
          <div class="material-row">
            <span class="number">1.3</span>
            <span class="material-name"><span class="missing-dot"></span>花名册3</span>
            <span class="type">材料类</span>
            <span class="task-empty" title="未发起补充任务" aria-label="未发起补充任务">—</span>
            <button class="search">去检索</button>
          </div>
          <div class="material-row">
            <span class="number">1.4</span>
            <span class="material-name"><span class="missing-dot"></span>花名册4</span>
            <span class="type">材料类</span>
            <span class="task-empty" title="未发起补充任务" aria-label="未发起补充任务">—</span>
            <button class="search">去检索</button>
          </div>
        </div>
      </section>
    </aside>

    <section class="editor">
      <div class="editor-actions">
        <button class="primary">核对无误</button>
        <button>重写本章</button>
        <button>单章下载</button>
      </div>
      <div class="document-shell">
        <aside class="doc-outline">
          <h2>大纲</h2>
          <button>折叠全部层级</button>
          <div class="outline-item">▼ 翁海辉</div>
          <div class="outline-sub">翁海辉-劳动合同（2022.01.01-2026.12.31）</div>
          <div class="outline-item" style="color:#333">▼ 陈宝灼</div>
          <div class="outline-sub">陈宝灼-健康证（有效期内）</div>
          <div class="outline-item" style="color:#333">▼ 林雄祯</div>
          <div class="outline-sub">林雄祯-身份证-有效期内</div>
        </aside>
        <div class="paper-area">
          <article class="paper">
            <h3>翁海辉</h3>
            <p>翁海辉-劳动合同（2022.01.01-2026.12.31）.pdf</p>
            <p class="paper-title">劳动合同书</p>
          </article>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
