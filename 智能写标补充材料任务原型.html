<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能写标 - 补充材料任务原型</title>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface-soft: #fafbfc;
      --text: #262626;
      --muted: #707780;
      --line: #e6e8eb;
      --line-strong: #d4d8dd;
      --primary: #1677ff;
      --primary-hover: #0958d9;
      --primary-soft: #eaf3ff;
      --success: #27864f;
      --success-soft: #eaf7ef;
      --warning: #b56a00;
      --warning-soft: #fff4df;
      --danger: #c83c32;
      --danger-soft: #fff0ee;
      --radius: 6px;
      --shadow: 0 2px 10px rgba(20, 30, 40, 0.05);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .icon { width: 17px; height: 17px; flex: 0 0 auto; }

    .global-header {
      height: 64px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: stretch;
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .header-leading { display: flex; align-items: center; gap: 18px; padding: 0 18px; min-width: 174px; }
    .icon-button {
      width: 34px;
      height: 34px;
      border: 0;
      background: transparent;
      color: #545b62;
      display: inline-grid;
      place-items: center;
      border-radius: 4px;
    }
    .icon-button:hover { background: #f2f4f6; }
    .brand { font-size: 16px; font-weight: 650; white-space: nowrap; }
    .platform-nav { display: flex; flex: 1; min-width: 0; justify-content: space-around; overflow: hidden; }
    .platform-item {
      border: 0;
      background: transparent;
      color: #51565c;
      padding: 0 20px;
      white-space: nowrap;
      position: relative;
      font-size: 15px;
    }
    .platform-item.active { color: var(--primary); font-weight: 650; }
    .platform-item.active::after { content: ""; position: absolute; left: 18px; right: 18px; bottom: 0; height: 2px; background: var(--primary); }
    .header-actions { display: flex; align-items: center; gap: 8px; padding: 0 16px; border-left: 1px solid var(--line); }
    .tenant-switch { display: inline-flex; border: 1px solid #b8d5ff; border-radius: 3px; overflow: hidden; color: var(--primary); font-size: 11px; }
    .tenant-switch span { padding: 2px 5px; }
    .tenant-switch span:first-child { background: var(--primary); color: #fff; }

    .workspace-tabs { height: 52px; padding: 0 32px; display: flex; align-items: flex-end; border-bottom: 1px solid var(--line); background: #f7f7f8; }
    .workspace-tab {
      height: 44px;
      min-width: 142px;
      padding: 0 20px;
      border: 1px solid transparent;
      border-bottom: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #363b40;
      font-size: 15px;
    }
    .workspace-tab.active { background: #fff; border-color: var(--line); color: var(--primary); font-weight: 650; border-radius: 6px 6px 0 0; }
    .workspace-close { width: 15px; height: 15px; color: #838a91; }

    .page { padding: 22px 32px 40px; }
    .view { display: none; }
    .view.active { display: block; }
    .surface { background: var(--surface); border: 1px solid #eceef0; border-radius: var(--radius); box-shadow: var(--shadow); }

    .search-panel { padding: 26px 30px; }
    .search-grid { display: grid; grid-template-columns: repeat(4, minmax(210px, 1fr)); gap: 22px 30px; }
    .field { min-width: 0; display: grid; grid-template-columns: 88px minmax(0, 1fr); align-items: center; gap: 10px; }
    .field.long-label { grid-template-columns: 150px minmax(0, 1fr); }
    .field label { font-weight: 600; text-align: right; white-space: nowrap; }
    .control {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      padding: 0 11px;
      background: #fff;
      color: var(--text);
      outline: none;
    }
    .control::placeholder { color: #b1b6bc; }
    .control:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.12); }
    .action-field { display: flex; justify-content: flex-end; align-items: center; gap: 12px; }
    .btn {
      min-height: 38px;
      padding: 7px 18px;
      border-radius: 5px;
      border: 1px solid var(--line-strong);
      background: #fff;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-weight: 600;
    }
    .btn:hover { border-color: #9ba3ab; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
    .btn-danger:hover { background: #ad3028; border-color: #ad3028; }
    .btn-link { border: 0; padding: 0; min-height: auto; color: var(--primary); background: transparent; font-weight: 600; }
    .btn-link:hover { color: var(--primary-hover); text-decoration: underline; }
    .btn-link.danger { color: var(--danger); }
    .btn-link.danger:hover { color: #a82f27; }

    .list-panel { margin-top: 20px; padding: 22px 28px 26px; }
    .list-toolbar { min-height: 42px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 16px; }
    .list-title { font-size: 16px; font-weight: 650; }
    .result-count { margin-left: 10px; color: var(--muted); font-size: 13px; font-weight: 400; }
    .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; }
    .main-table { min-width: 1928px; table-layout: fixed; }
    th, td { border-bottom: 1px solid var(--line); padding: 15px 14px; text-align: left; vertical-align: middle; overflow-wrap: anywhere; }
    th { background: #fafafa; color: #31363b; font-weight: 650; white-space: nowrap; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: #fcfdff; }
    .task-link { color: var(--primary); background: transparent; border: 0; padding: 0; font-weight: 600; }
    .task-link:hover { color: var(--primary-hover); text-decoration: underline; }
    .subline { color: var(--muted); margin-top: 3px; }
    .status {
      display: inline-flex;
      align-items: center;
      min-height: 25px;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 13px;
      white-space: nowrap;
    }
    .status.complete { color: var(--success); background: var(--success-soft); }
    .status.partial { color: var(--warning); background: var(--warning-soft); }
    .status.pending { color: var(--danger); background: var(--danger-soft); }
    .status.cancelled { color: #626b74; background: #eceff2; }
    .status.none { color: #616970; background: #f0f2f4; }
    .empty-result { display: none; text-align: center; color: var(--muted); padding: 48px 20px; }

    .expand-cell { padding-left: 10px; padding-right: 8px; text-align: center; }
    .expand-button {
      width: 30px;
      height: 30px;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      background: #fff;
      color: #67717b;
      display: inline-grid;
      place-items: center;
      padding: 0;
    }
    .expand-button:hover { color: var(--primary); border-color: #91caff; background: var(--primary-soft); }
    .expand-button[aria-expanded="true"] { color: var(--primary); border-color: #91caff; background: var(--primary-soft); }
    .expand-button .icon { width: 16px; height: 16px; }
    .main-task-row.expanded > td { background: #f7faff; border-bottom-color: #dbe7f7; }
    .process-detail-row > td { padding: 0; background: #fbfcfe; }
    .process-detail-row:hover > td { background: #fbfcfe; }
    .process-detail { width: 100%; min-width: 1180px; box-shadow: inset 0 1px 0 #dbe7f7; }
    .process-head {
      min-height: 58px;
      padding: 11px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .process-heading { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .process-heading-mark { width: 30px; height: 30px; border-radius: 5px; display: grid; place-items: center; color: var(--primary); background: var(--primary-soft); }
    .process-heading-mark .icon { width: 16px; height: 16px; }
    .process-title { font-size: 14px; font-weight: 700; }
    .process-subtitle { color: var(--muted); font-size: 12px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .process-summary { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; white-space: nowrap; }
    .process-summary strong { color: var(--text); }
    .stage-board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #fff; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .stage-group { min-width: 0; padding: 16px 22px 15px; border-right: 1px solid var(--line); }
    .stage-group:last-child { border-right: 0; }
    .stage-header { display: flex; align-items: center; gap: 10px; min-height: 30px; }
    .stage-number { width: 25px; height: 25px; border-radius: 50%; display: grid; place-items: center; background: #eef2f6; color: #59636d; font-size: 12px; font-weight: 700; }
    .stage-group.complete .stage-number { background: var(--success-soft); color: var(--success); }
    .stage-group.running .stage-number { background: var(--primary-soft); color: var(--primary); }
    .stage-group.failed .stage-number { background: var(--danger-soft); color: var(--danger); }
    .stage-group.paused .stage-number { background: var(--warning-soft); color: var(--warning); }
    .stage-name { font-size: 15px; font-weight: 700; }
    .stage-current { margin-left: auto; min-height: 24px; padding: 2px 8px; border-radius: 4px; background: #f0f2f4; color: #626b74; font-size: 12px; white-space: nowrap; }
    .stage-group.complete .stage-current { color: var(--success); background: var(--success-soft); }
    .stage-group.running .stage-current { color: var(--primary); background: var(--primary-soft); }
    .stage-group.failed .stage-current { color: var(--danger); background: var(--danger-soft); }
    .stage-group.paused .stage-current { color: var(--warning); background: var(--warning-soft); }
    .substep-track { display: flex; align-items: center; min-height: 42px; margin: 15px 0 10px; }
    .substep { display: inline-flex; align-items: center; gap: 6px; color: #969da4; white-space: nowrap; font-size: 12px; }
    .substep-code { width: 21px; height: 21px; border-radius: 50%; display: grid; place-items: center; border: 1px solid #cfd4d9; background: #fff; color: #7b848c; font-size: 11px; font-weight: 700; }
    .substep.complete { color: #3f7457; }
    .substep.complete .substep-code { border-color: #8fc6a7; background: var(--success-soft); color: var(--success); }
    .substep.current { color: var(--primary); font-weight: 650; }
    .substep.current .substep-code { border-color: var(--primary); background: var(--primary); color: #fff; box-shadow: 0 0 0 3px rgba(22,119,255,.1); }
    .substep.failed { color: var(--danger); font-weight: 650; }
    .substep.failed .substep-code { border-color: var(--danger); background: var(--danger); color: #fff; }
    .substep.paused { color: var(--warning); font-weight: 650; }
    .substep.paused .substep-code { border-color: var(--warning); background: var(--warning-soft); color: var(--warning); }
    .substep-link { height: 1px; min-width: 18px; flex: 1; margin: 0 8px; background: #d9dde1; }
    .substep-link.complete { background: #8fc6a7; }
    .exception-row { min-height: 25px; display: flex; align-items: center; gap: 7px; color: #9299a0; font-size: 11px; white-space: nowrap; }
    .exception-label { color: #7a828a; }
    .exception-item { padding: 2px 6px; border-radius: 3px; background: #f3f4f5; }
    .exception-item.active.failed { color: var(--danger); background: var(--danger-soft); font-weight: 650; }
    .exception-item.active.paused { color: var(--warning); background: var(--warning-soft); font-weight: 650; }
    .stage-meta { margin-top: 12px; padding-top: 10px; border-top: 1px dashed #e1e4e7; display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 5px 12px; font-size: 12px; }
    .stage-meta-label { color: #8a9299; }
    .stage-meta-value { min-width: 0; color: #4c545b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stage-group.failed .stage-result { color: var(--danger); }

    .pagination { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 16px; color: var(--muted); }
    .page-button { width: 32px; height: 32px; border: 1px solid var(--line-strong); background: #fff; border-radius: 4px; color: var(--text); }
    .page-button.active { background: var(--primary); border-color: var(--primary); color: #fff; }

    .detail-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
    .back-button { width: 36px; height: 36px; border: 1px solid var(--line-strong); border-radius: 5px; background: #fff; display: grid; place-items: center; color: #4f565d; }
    .detail-title { margin: 0; font-size: 20px; letter-spacing: 0; }
    .breadcrumb { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .context-band { padding: 18px 22px; }
    .context-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .context-item { padding: 2px 20px; border-right: 1px solid var(--line); min-width: 0; }
    .context-item:first-child { padding-left: 0; }
    .context-item:last-child { border-right: 0; }
    .context-label { color: var(--muted); margin-bottom: 5px; }
    .context-value { font-weight: 650; overflow-wrap: anywhere; }
    .summary-strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
    .summary-item { padding: 18px 22px; border-right: 1px solid var(--line); }
    .summary-item:last-child { border-right: 0; }
    .summary-label { color: var(--muted); margin-bottom: 4px; }
    .summary-value { font-size: 22px; line-height: 1.2; font-weight: 700; }
    .detail-panel { margin-top: 20px; overflow: hidden; }
    .detail-toolbar { display: flex; align-items: center; justify-content: space-between; min-height: 62px; padding: 0 22px; border-bottom: 1px solid var(--line); }
    .detail-table { table-layout: fixed; min-width: 2100px; }
    .cell-muted { color: #90969c; }
    .operation-actions { display: flex; align-items: center; gap: 12px; white-space: nowrap; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(21, 28, 36, 0.48);
    }
    .modal-backdrop.open { display: flex; }
    .modal { width: min(760px, 100%); max-height: calc(100vh - 40px); overflow: auto; background: #fff; border-radius: 8px; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.18); }
    .task-detail-modal { width: min(720px, 100%); }
    .confirm-modal { width: min(480px, 100%); }
    .modal-head { min-height: 58px; padding: 0 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 17px; font-weight: 700; }
    .modal-body { padding: 20px; }
    .modal-foot { min-height: 62px; padding: 12px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; align-items: center; }
    .task-context { display: grid; grid-template-columns: 1.25fr 1.25fr 1fr .85fr; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .task-context-cell { min-width: 0; padding: 12px 14px; background: #fafbfc; border-right: 1px solid var(--line); }
    .task-context-cell:last-child { border-right: 0; }
    .task-field-label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .task-context-cell strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task-section-title { font-size: 15px; font-weight: 650; margin: 20px 0 10px; }
    .task-condition-preview { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .task-preview-meta { display: grid; grid-template-columns: 1fr 1fr; background: #f7f8fa; border-bottom: 1px solid var(--line); }
    .task-preview-meta > div { padding: 10px 13px; }
    .task-preview-meta > div + div { border-left: 1px solid var(--line); }
    .task-logic-mark { display: inline-block; padding: 2px 7px; border-radius: 4px; background: #f1e9ff; color: #7e3dbb; font-size: 12px; }
    .task-preview-table { width: 100%; border-collapse: collapse; }
    .task-preview-table th, .task-preview-table td { text-align: left; padding: 10px 13px; border-bottom: 1px solid #edf0f3; }
    .task-preview-table tr:last-child td { border-bottom: 0; }
    .task-preview-table th { color: var(--muted); font-size: 12px; font-weight: 500; background: #fcfcfd; }
    .readonly-box { min-height: 70px; padding: 11px 13px; border: 1px solid #cfd5dd; border-radius: 6px; background: #fff; color: var(--text); overflow-wrap: anywhere; }
    .attachment-list { display: grid; gap: 8px; }
    .attachment-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
    .attachment-main { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .attachment-icon { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 5px; color: var(--primary); background: var(--primary-soft); }
    .attachment-icon .icon { width: 16px; height: 16px; }
    .attachment-text { min-width: 0; }
    .attachment-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .attachment-meta { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
    .attachment-empty { padding: 14px; border: 1px dashed var(--line-strong); border-radius: 6px; color: var(--muted); text-align: center; background: #fafbfc; }
    .attachment-preview-modal { width: min(680px, 100%); z-index: 120; }
    .attachment-preview { min-height: 260px; border: 1px solid var(--line); border-radius: 6px; background: #fafbfc; padding: 24px; }
    .attachment-preview-file { display: grid; place-items: center; gap: 11px; min-height: 210px; text-align: center; color: var(--muted); }
    .attachment-preview-file .preview-file-icon { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 8px; color: var(--primary); background: var(--primary-soft); }
    .attachment-preview-file .preview-file-icon .icon { width: 26px; height: 26px; }
    .attachment-preview-title { color: var(--text); font-weight: 650; overflow-wrap: anywhere; }
    .attachment-preview-note { font-size: 13px; }
    .record-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .record-item { min-width: 0; padding: 11px 13px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .record-item:nth-child(2n) { border-right: 0; }
    .record-item:nth-last-child(-n+2) { border-bottom: 0; }
    .record-value { font-weight: 600; overflow-wrap: anywhere; }
    .confirm-copy { margin: 0; color: #414850; line-height: 1.7; }
    .confirm-copy strong { color: var(--text); }
    .modal-foot.with-gap { gap: 10px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      background: #30363b;
      color: #fff;
      min-height: 42px;
      padding: 9px 16px;
      display: none;
      align-items: center;
      gap: 8px;
      border-radius: 5px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
      z-index: 80;
    }
    .toast.show { display: flex; }

    @media (max-width: 1180px) {
      .platform-item { padding: 0 12px; }
      .platform-item:nth-last-child(-n+2) { display: none; }
      .search-grid { grid-template-columns: repeat(2, minmax(240px, 1fr)); }
      .context-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 0; }
      .context-item:nth-child(2) { border-right: 0; }
    }
    @media (max-width: 720px) {
      .global-header { height: 56px; }
      .header-leading { min-width: 0; padding: 0 12px; }
      .brand { display: none; }
      .platform-nav { justify-content: flex-start; }
      .platform-item { display: none; }
      .platform-item.active { display: block; padding: 0 18px; }
      .header-actions { margin-left: auto; padding: 0 10px; }
      .header-actions .icon-button { display: none; }
      .workspace-tabs { padding: 0 12px; overflow-x: auto; }
      .workspace-tab { min-width: 122px; }
      .page { padding: 14px 12px 28px; }
      .search-panel { padding: 18px 14px; }
      .search-grid { grid-template-columns: 1fr; gap: 14px; }
      .field { grid-template-columns: 82px minmax(0, 1fr); }
      .action-field { justify-content: stretch; }
      .action-field .btn { flex: 1; }
      .list-panel { padding: 14px 12px 18px; }
      .list-toolbar { align-items: flex-start; }
      .process-detail { min-width: 1080px; }
      .process-head { padding-left: 16px; padding-right: 16px; }
      .stage-group { padding-left: 16px; padding-right: 16px; }
      .context-grid { grid-template-columns: 1fr; }
      .context-item { border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 0; }
      .context-item:last-child { border-bottom: 0; }
      .summary-strip { grid-template-columns: repeat(2, 1fr); }
      .summary-item:nth-child(2n) { border-right: 0; }
      .summary-item:nth-child(-n+4) { border-bottom: 1px solid var(--line); }
      .summary-item:last-child { grid-column: 1 / -1; border-right: 0; border-bottom: 0; }
      .detail-title { font-size: 18px; }
      .detail-toolbar { padding: 0 14px; }

      { name: '党建', conditions: [['资料类型', '党建'], ['资料年度', '2025—2026']], note: '补充党组织建设、活动记录等有效证明材料。', noSupplementNote: '招标文件未涉及党建材料要求。', attachments: [] },

    function buildDetails(statuses, date, initiator = '李玉春') {

        const status = statuses[index];

          queryGroup: `查询组${index + 1}`,
          logic: '且',
          initiator,
          initiatedAt: `${date} ${String(9 + index).padStart(2, '0')}:20:00`,
          reviewer: reviewed ? (index % 2 ? '刘洋' : '王敏') : '—',
          reviewedAt: reviewed ? `${date} ${String(10 + index).padStart(2, '0')}:15:00` : '—',

    const processSamples = {

      ],
      review: [
        { name: '解析招标文件', status: '人工复核完成', state: 'complete', startedAt: '2026-09-16 10:07:05', updatedAt: '2026-09-16 10:16:38', method: '系统解析 + 人工复核', result: '已提取项目需求、评分标准及资格审查条件。' },
        { name: '生成标书目录', status: '目录输出完成', state: 'complete', startedAt: '2026-09-16 10:16:40', updatedAt: '2026-09-16 10:22:19', method: '系统生成', result: '已生成 9 个一级目录、27 个二级目录。' },

      ],

        { name: '生成标书目录', status: '未开始', state: 'pending', startedAt: '—', updatedAt: '—', method: '—', result: '等待招标文件解析完成。' },

      ],
      complete: [
        { name: '解析招标文件', status: '人工复核完成', state: 'complete', startedAt: '2026-08-27 14:12:51', updatedAt: '2026-08-27 14:20:33', method: '系统解析 + 人工复核', result: '已完成招标文件解析与关键条款复核。' },
        { name: '生成标书目录', status: '目录输出完成', state: 'complete', startedAt: '2026-08-27 14:20:35', updatedAt: '2026-08-27 14:26:18', method: '系统生成', result: '已生成 10 个一级目录、31 个二级目录。' },

    const stageDefinitions = [

        normal: [{ code: '0', label: '解析中' }, { code: '1', label: '系统解析完成' }, { code: '2', label: '人工复核完成' }],
        exceptional: [{ code: '3', label: '解析失败', kind: 'failed' }, { code: '-1', label: '作废', kind: 'failed' }]
      },
      {
        title: '目录状态',
        normal: [{ code: '0', label: '目录输出中' }, { code: '1', label: '目录输出完成' }],
        exceptional: [{ code: '2', label: '暂停目录输出', kind: 'paused' }, { code: '3', label: '目录输出失败', kind: 'failed' }, { code: '-1', label: '作废', kind: 'failed' }]
      },
      {
        title: '写标状态',
        normal: [{ code: '4', label: '标书输出中' }],

      }

    const tasks = [
      {
        number: 'TB260916000004', name: '中央党校项目智慧餐饮服务', province: '北京市北京市', industry: '教育', businessType: '日配',
        bidder: '2115/永辉彩食鲜供应链管理有限公司', analysis: '人工复核完成', catalog: '目录输出完成', writing: '标书输出中', createdAt: '2026-09-16 18:15:24',
        process: processSamples.writing,
        details: buildDetails(['已补充', '待处理', '已补充', '待处理', '无需补充', '无需补充'], '2026-09-16')

    let pendingCancelIndex = null;
    let expandedTaskNumber = null;
    let visibleTasks = tasks;

    function renderIcons() {
      if (window.lucide) window.lucide.createIcons();
    }

    function getSummary(details) {
      const active = details.filter(item => item.status !== '无需补充');
      const pending = details.filter(item => item.status === '待处理').length;
      const supplied = details.filter(item => item.status === '已补充').length;
      const notRequired = details.filter(item => item.status === '无需补充').length;
      const cancelled = details.filter(item => item.status === '已取消').length;
      let overall = '全部完成';
      if (pending && (supplied || cancelled)) overall = '部分完成';
      else if (pending) overall = '待处理';
      return { total: details.length, active: active.length, pending, supplied, notRequired, cancelled, overall };
    }

    function statusClass(status) {
      return status === '全部完成' || status === '已补充' ? 'complete' : status === '部分完成' ? 'partial' : status === '待处理' ? 'pending' : status === '已取消' ? 'cancelled' : 'none';
    }

    function statusTag(status) {
      return `<span class="status ${statusClass(status)}">${status}</span>`;
    }

    function renderStageGroup(stage, index) {
      const definition = stageDefinitions[index];
      const normalIndex = definition.normal.findIndex(item => item.label === stage.status);
      const activeException = definition.exceptional.find(item => item.label === stage.status);
      const hasUncodedCurrent = normalIndex < 0 && !activeException && stage.status !== '未开始';
      const completedNormalCount = activeException
        ? (activeException.kind === 'failed' && stage.status !== '作废' ? 1 : 0)
        : hasUncodedCurrent
          ? definition.normal.length
          : normalIndex;
      const steps = definition.normal.map((item, stepIndex) => {
        let state = 'pending';
        if (stage.state === 'complete' && stepIndex <= normalIndex) state = 'complete';
        else if (stepIndex < normalIndex || stepIndex < completedNormalCount) state = 'complete';
        else if (stepIndex === normalIndex) state = 'current';
        return { ...item, state };
      });
      if (hasUncodedCurrent) {
        steps.push({ code: '—', label: stage.status, state: stage.state === 'complete' ? 'complete' : 'current' });
      }
      const stepHtml = steps.map((item, stepIndex) => {
        const next = steps[stepIndex + 1];
        const linkComplete = item.state === 'complete' && next && (next.state === 'complete' || next.state === 'current');
        return `<span class="substep ${item.state}"><span class="substep-code">${item.code}</span><span>${item.label}</span></span>${next ? `<span class="substep-link ${linkComplete ? 'complete' : ''}"></span>` : ''}`;
      }).join('');
      const exceptionHtml = definition.exceptional.length
        ? `<div class="exception-row"><span class="exception-label">异常/终止</span>${definition.exceptional.map(item => `<span class="exception-item ${stage.status === item.label ? `active ${item.kind}` : ''}">${item.code} ${item.label}</span>`).join('')}</div>`
        : '<div class="exception-row"><span class="exception-label">后续状态编码待补充</span></div>';
      const groupState = activeException ? activeException.kind : stage.state;
      return `<article class="stage-group ${groupState}">
        <div class="stage-header"><span class="stage-number">${index + 1}</span><span class="stage-name">${definition.title}</span><span class="stage-current">${stage.status}</span></div>
        <div class="substep-track">${stepHtml}</div>
        ${exceptionHtml}
        <div class="stage-meta">
          <span class="stage-meta-label">最近处理</span><span class="stage-meta-value">${stage.updatedAt === '—' ? '时间暂无' : stage.updatedAt}</span>
          <span class="stage-meta-label">处理结果</span><span class="stage-meta-value stage-result" title="${stage.result}">${stage.result}</span>
        </div>
      </article>`;
    }

    function renderProcessDetail(task) {
      const currentIndex = task.process.findIndex(stage => stage.state === 'failed' || stage.state === 'paused' || stage.state === 'running');
      const displayIndex = currentIndex >= 0 ? currentIndex : Math.max(0, task.process.map(stage => stage.state).lastIndexOf('complete'));
      const current = task.process[displayIndex];
      const completedCount = task.process.filter(stage => stage.state === 'complete').length;
      const progressText = current && current.state === 'failed' ? '流程已中断' : `${completedCount}/3 阶段完成`;
      return `<tr class="process-detail-row">
        <td colspan="14">
          <section class="process-detail" aria-label="${task.name}流程详情">
            <div class="process-head">
              <div class="process-heading">
                <span class="process-heading-mark"><i data-lucide="git-branch" class="icon"></i></span>
                <div><div class="process-title">执行进度</div><div class="process-subtitle">${task.number} · ${task.name}</div></div>
              </div>
              <div class="process-summary"><span>当前阶段</span><strong>${stageDefinitions[displayIndex].title}</strong><span class="status ${current && current.state === 'failed' ? 'pending' : current && current.state === 'complete' ? 'complete' : 'partial'}">${current ? current.status : '未开始'}</span><span>${progressText}</span></div>
            </div>
            <div class="stage-board">${task.process.map(renderStageGroup).join('')}</div>
          </section>
        </td>
      </tr>`;
    }

    function renderTaskRows(rows) {
      visibleTasks = rows;
      const tableWrap = document.getElementById('mainTableWrap');
      const previousScrollLeft = tableWrap.scrollLeft;
      taskTableBody.innerHTML = rows.map(task => {
        const summary = getSummary(task.details);
        const expanded = expandedTaskNumber === task.number;
        return `<tr class="main-task-row ${expanded ? 'expanded' : ''}">
          <td class="expand-cell"><button class="expand-button" type="button" data-expand-process="${task.number}" aria-expanded="${expanded}" title="${expanded ? '收起流程详情' : '展开流程详情'}" aria-label="${expanded ? '收起' : '展开'} ${task.name} 流程详情"><i data-lucide="${expanded ? 'chevron-down' : 'chevron-right'}" class="icon"></i></button></td>
          <td><button class="task-link" type="button" data-project-number="${task.number}">${task.number}</button></td>
          <td>${task.name}</td><td>${task.province}</td><td>${task.industry}</td><td>${task.businessType}</td><td>${task.bidder}</td>
          <td><button class="btn-link" type="button" data-download>下载</button></td><td>${task.analysis}</td><td>${task.catalog}</td><td>${task.writing}</td>
          <td><button class="task-link" type="button" data-material-count="${task.number}" aria-label="查看 ${task.name} 的补充材料任务">${summary.active}</button></td>
          <td>${statusTag(summary.overall)}</td><td>${task.createdAt}</td>
        </tr>${expanded ? renderProcessDetail(task) : ''}`;
      }).join('');
      document.getElementById('mainTableWrap').style.display = rows.length ? 'block' : 'none';
      document.getElementById('emptyResult').style.display = rows.length ? 'none' : 'block';
      document.getElementById('resultCount').textContent = `共 ${rows.length} 条`;
      bindTaskActions();
      renderIcons();
      tableWrap.scrollLeft = previousScrollLeft;
    }

    function bindTaskActions() {
      document.querySelectorAll('[data-expand-process]').forEach(button => {
        button.addEventListener('click', () => {
          expandedTaskNumber = expandedTaskNumber === button.dataset.expandProcess ? null : button.dataset.expandProcess;
          renderTaskRows(visibleTasks);
        });
      });
      document.querySelectorAll('[data-material-count]').forEach(button => {
        button.addEventListener('click', () => openDetails(button.dataset.materialCount));
      });
      document.querySelectorAll('[data-project-number]').forEach(button => {
        button.addEventListener('click', () => showToast(`打开写标任务 ${button.dataset.projectNumber}`));
      });
      document.querySelectorAll('[data-download]').forEach(button => {
        button.addEventListener('click', () => showToast('招标文件开始下载'));
      });
    }

    function openDetails(number) {
      const task = tasks.find(item => item.number === number);
      if (!task) return;
      const summary = getSummary(task.details);
      document.getElementById('detailTaskNumber').textContent = task.number;
      document.getElementById('detailProjectName').textContent = task.name;
      document.getElementById('detailBidder').textContent = task.bidder;
      document.getElementById('detailOverallStatus').innerHTML = statusTag(summary.overall);
      document.getElementById('summaryStrip').innerHTML = `
        <div class="summary-item"><div class="summary-label">全部</div><div class="summary-value">${summary.total}</div></div>
        <div class="summary-item"><div class="summary-label">待处理</div><div class="summary-value" style="color:var(--danger)">${summary.pending}</div></div>
        <div class="summary-item"><div class="summary-label">已补充</div><div class="summary-value" style="color:var(--success)">${summary.supplied}</div></div>
        <div class="summary-item"><div class="summary-label">无需补充</div><div class="summary-value">${summary.notRequired}</div></div>
        <div class="summary-item"><div class="summary-label">已取消</div><div class="summary-value">${summary.cancelled}</div></div>`;
      currentDetailTask = task;
      detailTableBody.innerHTML = task.details.map((item, index) => `<tr>
        <td><strong>${item.name}</strong></td>
        <td>${item.query}</td>
        <td class="${item.status === '无需补充' ? 'cell-muted' : ''}">${item.status === '无需补充' ? '—' : item.note}</td>
        <td class="${item.status === '无需补充' ? '' : 'cell-muted'}">${item.status === '无需补充' ? item.noSupplementNote : '—'}</td>
        <td>${statusTag(item.status)}</td>
        <td>${item.initiator}</td><td>${item.initiatedAt}</td><td>${item.reviewer}</td><td>${item.reviewedAt}</td><td>${item.supplementer}</td><td>${item.supplementedAt}</td>
        <td><div class="operation-actions"><button class="btn-link view-task-detail" type="button" data-detail-index="${index}">查看</button>${item.status === '待处理' ? `<button class="btn-link danger cancel-task" type="button" data-detail-index="${index}">取消</button>` : ''}</div></td>
      </tr>`).join('');
      document.querySelectorAll('.view-task-detail').forEach(button => {
        button.addEventListener('click', () => openTaskDetail(Number(button.dataset.detailIndex)));
      });
      document.querySelectorAll('.cancel-task').forEach(button => {
        button.addEventListener('click', () => openCancelTask(Number(button.dataset.detailIndex)));
      });
      listView.classList.remove('active');
      detailView.classList.add('active');
      window.scrollTo({ top: 0, behavior: 'auto' });
      renderIcons();
    }

    function openTaskDetail(index) {
      if (!currentDetailTask) return;
      const item = currentDetailTask.details[index];
      if (!item) return;
      const conditionRows = item.conditions.map(condition => `<tr><td>${condition[0]}</td><td>${condition[1]}</td></tr>`).join('');
      document.getElementById('taskDetailModalBody').innerHTML = `
        <div class="task-context">
          <div class="task-context-cell"><span class="task-field-label">名称</span><strong>${item.name}</strong></div>
          <div class="task-context-cell"><span class="task-field-label">投标主体</span><strong>${currentDetailTask.bidder}</strong></div>
          <div class="task-context-cell"><span class="task-field-label">当前查询组</span><strong>${item.queryGroup}</strong></div>
          <div class="task-context-cell"><span class="task-field-label">任务状态</span><strong>${statusTag(item.status)}</strong></div>
        </div>
        <div class="task-section-title">查询条件</div>
        <div class="task-condition-preview">
          <div class="task-preview-meta">
            <div><span class="task-field-label">档案类型</span><strong>${item.name}</strong></div>
            <div><span class="task-field-label">逻辑关系</span><strong><span class="task-logic-mark">${item.logic}</span></strong></div>
          </div>
          <table class="task-preview-table"><thead><tr><th>查询字段</th><th>条件值</th></tr></thead><tbody>${conditionRows}</tbody></table>
        </div>
        <div class="task-section-title">补充说明</div>
        <div class="readonly-box">${item.status === '无需补充' ? '—' : item.note}</div>
        <div class="task-section-title">无需补充说明</div>
        <div class="readonly-box">${item.status === '无需补充' ? item.noSupplementNote : '—'}</div>
        <div class="task-section-title">附件</div>
        <div class="attachment-list">${item.attachments.length ? item.attachments.map((attachment, attachmentIndex) => `
          <div class="attachment-item">
            <div class="attachment-main"><span class="attachment-icon"><i data-lucide="paperclip" class="icon"></i></span><div class="attachment-text"><span class="attachment-name" title="${attachment.name}">${attachment.name}</span><span class="attachment-meta">${attachment.type} · ${attachment.size}</span></div></div>
            <button class="btn-link attachment-view" type="button" data-detail-index="${index}" data-attachment-index="${attachmentIndex}">查看</button>
          </div>`).join('') : '<div class="attachment-empty">暂无附件</div>'}</div>
        <div class="task-section-title">处理记录</div>
        <div class="record-grid">
          <div class="record-item"><span class="task-field-label">发起人</span><div class="record-value">${item.initiator}</div></div>
          <div class="record-item"><span class="task-field-label">发起时间</span><div class="record-value">${item.initiatedAt}</div></div>
          <div class="record-item"><span class="task-field-label">审核人</span><div class="record-value">${item.reviewer}</div></div>
          <div class="record-item"><span class="task-field-label">审核时间</span><div class="record-value">${item.reviewedAt}</div></div>
          <div class="record-item"><span class="task-field-label">补充人</span><div class="record-value">${item.supplementer}</div></div>
          <div class="record-item"><span class="task-field-label">补充时间</span><div class="record-value">${item.supplementedAt}</div></div>
        </div>`;
      taskDetailModal.classList.add('open');
      document.querySelectorAll('.attachment-view').forEach(button => {
        button.addEventListener('click', () => openAttachmentPreview(Number(button.dataset.detailIndex), Number(button.dataset.attachmentIndex)));
      });
      renderIcons();
    }

    function openAttachmentPreview(detailIndex, attachmentIndex) {
      if (!currentDetailTask || !currentDetailTask.details.length) return;
      const item = currentDetailTask.details[detailIndex];
      const attachment = item?.attachments[attachmentIndex];
      if (!attachment) return;
      document.getElementById('attachmentPreviewFileName').textContent = attachment.name;
      document.getElementById('attachmentPreviewNote').textContent = `${attachment.type} · ${attachment.size} · ${attachment.note}`;
      attachmentPreviewModal.classList.add('open');
      renderIcons();
    }

    function closeAttachmentPreview() {
      attachmentPreviewModal.classList.remove('open');
    }

    function closeTaskDetail() {
      taskDetailModal.classList.remove('open');
    }

    function openCancelTask(index) {
      if (!currentDetailTask) return;
      const item = currentDetailTask.details[index];
      if (!item || item.status !== '待处理') return;
      pendingCancelIndex = index;
      document.getElementById('cancelTaskMessage').innerHTML = `确认取消“<strong>${item.name}</strong>”补充材料任务吗？取消后任务状态将变为“已取消”，且不可恢复。`;
      cancelTaskModal.classList.add('open');
      renderIcons();
    }

    function closeCancelTask() {
      cancelTaskModal.classList.remove('open');
      pendingCancelIndex = null;
    }

    function confirmCancelTask() {
      if (!currentDetailTask || pendingCancelIndex === null) return;
      const taskNumber = currentDetailTask.number;
      const item = currentDetailTask.details[pendingCancelIndex];
      if (!item || item.status !== '待处理') {
        closeCancelTask();
        return;
      }
      const taskName = item.name;
      item.status = '已取消';
      closeCancelTask();
      filterTasks();
      openDetails(taskNumber);
      showToast(`${taskName}任务已取消`);
    }

    function showToast(message) {
      document.getElementById('toastText').textContent = message;
      toast.classList.add('show');
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function filterTasks() {
      const project = document.getElementById('projectName').value.trim();
      const province = document.getElementById('province').value;
      const industry = document.getElementById('industry').value;
      const number = document.getElementById('taskNumber').value.trim();
      const bidder = document.getElementById('bidder').value;
      const materialTaskStatus = document.getElementById('materialTaskStatus').value;
      const rows = tasks.filter(task =>
        (!project || task.name.includes(project)) &&
        (!province || task.province === province) &&
        (!industry || task.industry === industry) &&
        (!number || task.number.includes(number)) &&
        (!bidder || task.bidder.includes(bidder)) &&
        (!materialTaskStatus || getSummary(task.details).overall === materialTaskStatus)
      );
      expandedTaskNumber = null;
      renderTaskRows(rows);
    }

    document.getElementById('searchButton').addEventListener('click', filterTasks);
    document.getElementById('resetButton').addEventListener('click', () => {
      ['projectName', 'province', 'industry', 'taskNumber', 'bidder', 'createdDate', 'materialTaskStatus'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('creator').value = '李玉春';
      expandedTaskNumber = null;
      renderTaskRows(tasks);
    });
    document.getElementById('uploadButton').addEventListener('click', () => showToast('打开招标文件上传窗口'));
    document.getElementById('closeTaskDetailModal').addEventListener('click', closeTaskDetail);
    document.getElementById('confirmTaskDetailModal').addEventListener('click', closeTaskDetail);
    taskDetailModal.addEventListener('click', event => { if (event.target === taskDetailModal) closeTaskDetail(); });
    document.getElementById('closeAttachmentPreview').addEventListener('click', closeAttachmentPreview);
    document.getElementById('confirmAttachmentPreview').addEventListener('click', closeAttachmentPreview);
    attachmentPreviewModal.addEventListener('click', event => { if (event.target === attachmentPreviewModal) closeAttachmentPreview(); });
    document.getElementById('closeCancelTaskModal').addEventListener('click', closeCancelTask);
    document.getElementById('keepTaskButton').addEventListener('click', closeCancelTask);
    document.getElementById('confirmCancelTaskButton').addEventListener('click', confirmCancelTask);
    cancelTaskModal.addEventListener('click', event => { if (event.target === cancelTaskModal) closeCancelTask(); });
    document.getElementById('backButton').addEventListener('click', () => {
      detailView.classList.remove('active');
      listView.classList.add('active');
      document.getElementById('mainTableWrap').scrollLeft = 0;
      window.scrollTo({ top: 0, behavior: 'auto' });
    });

    renderTaskRows(tasks);
    renderIcons();
  </script>
</body>
</html>
